name: Update news

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Fetch Steam news RSS (per language)
        run: |
          python3 - << 'EOF'
          import json, os, time, urllib.request, xml.etree.ElementTree as ET, re, html
          from email.utils import parsedate_to_datetime

          def fetch(url, attempts=3):
              last = None
              for attempt in range(attempts):
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                      with urllib.request.urlopen(req, timeout=30) as res:
                          return res.read()
                  except Exception as error:
                      last = error
                      time.sleep(2 * (attempt + 1))
              raise last

          os.makedirs("data", exist_ok=True)
          langs = [("en", "english"), ("zh-CN", "schinese"), ("zh-TW", "tchinese"), ("ja", "japanese"), ("ko", "korean"),
                   ("fr", "french"), ("it", "italian"), ("de", "german"), ("es-ES", "spanish"), ("da", "danish"),
                   ("ru", "russian"), ("tr", "turkish"), ("no", "norwegian"), ("pl", "polish"), ("th", "thai"),
                   ("sv", "swedish"), ("fi", "finnish"), ("nl", "dutch"), ("pt-BR", "brazilian"), ("pt-PT", "portuguese"),
                   ("es-419", "latam"), ("uk", "ukrainian"), ("bg", "bulgarian"), ("hu", "hungarian"), ("id", "indonesian"),
                   ("el", "greek"), ("cs", "czech"), ("ro", "romanian"), ("vi", "vietnamese"), ("ar", "arabic")]
          failed = []
          for code, steam_lang in langs:
              try:
                  root = ET.fromstring(
                      fetch(f"https://store.steampowered.com/feeds/news/app/4142580/?l={steam_lang}").decode("utf-8")
                  )
              except Exception as error:
                  failed.append(code)
                  print(f"::warning::news fetch failed for {code}: {error}")
                  continue
              items = []
              for item in root.iter("item"):
                  enclosure = item.find("enclosure")
                  image = enclosure.get("url") if enclosure is not None else None
                  if not image:
                      desc = html.unescape(item.findtext("description") or "")
                      m = re.search(r'<img[^>]+src="([^"]+)"', desc)
                      image = m.group(1) if m else None
                  pub = item.findtext("pubDate")
                  items.append({
                      "title": (item.findtext("title") or "").strip(),
                      "url": (item.findtext("link") or "").strip(),
                      "date": int(parsedate_to_datetime(pub).timestamp()) if pub else 0,
                      "image": image,
                  })
              out = {"appnews": {"appid": 4142580, "newsitems": items[:6]}}
              with open(f"data/news-{code}.json", "w", encoding="utf-8") as f:
                  json.dump(out, f, ensure_ascii=False, indent=2)
              print(f"data/news-{code}.json: {len(out['appnews']['newsitems'])} items")
          if len(failed) == len(langs):
              raise SystemExit("news fetch failed for every language")
          if failed:
              print(f"news: kept previous data for {len(failed)} failed languages: {', '.join(failed)}")
          EOF

      - name: Fetch Steam media (per language)
        run: |
          python3 - << 'EOF'
          import json, os, time, urllib.request

          def fetch(url, attempts=3):
              last = None
              for attempt in range(attempts):
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                      with urllib.request.urlopen(req, timeout=30) as res:
                          return res.read()
                  except Exception as error:
                      last = error
                      time.sleep(2 * (attempt + 1))
              raise last

          os.makedirs("data", exist_ok=True)
          langs = [("en", "english"), ("zh-CN", "schinese"), ("zh-TW", "tchinese"), ("ja", "japanese"), ("ko", "korean"),
                   ("fr", "french"), ("it", "italian"), ("de", "german"), ("es-ES", "spanish"), ("da", "danish"),
                   ("ru", "russian"), ("tr", "turkish"), ("no", "norwegian"), ("pl", "polish"), ("th", "thai"),
                   ("sv", "swedish"), ("fi", "finnish"), ("nl", "dutch"), ("pt-BR", "brazilian"), ("pt-PT", "portuguese"),
                   ("es-419", "latam"), ("uk", "ukrainian"), ("bg", "bulgarian"), ("hu", "hungarian"), ("id", "indonesian"),
                   ("el", "greek"), ("cs", "czech"), ("ro", "romanian"), ("vi", "vietnamese"), ("ar", "arabic")]
          failed = []
          for code, steam_lang in langs:
              try:
                  data = json.loads(
                      fetch(f"https://store.steampowered.com/api/appdetails?appids=4142580&l={steam_lang}")
                  )
                  # Steam keys the payload by the app's canonical appid, which no
                  # longer matches the requested 4142580 — take whichever key comes
                  # back and fail this language if the payload carries no content.
                  payload = data.get("4142580") or next(iter(data.values()), None)
                  d = (payload or {}).get("data") or {}
                  movies = d.get("movies", [])
                  shots = d.get("screenshots", [])
                  if not movies and not shots:
                      raise ValueError("appdetails payload carries no media")
              except Exception as error:
                  failed.append(code)
                  print(f"::warning::media fetch failed for {code}: {error}")
                  continue
              out = {
                  "videos": [
                      {"name": m.get("name", ""), "thumb": m.get("thumbnail", ""), "hls": m.get("hls_h264", "")}
                      for m in movies
                  ],
                  "screenshots": [s.get("path_full", "") for s in shots],
              }
              with open(f"data/media-{code}.json", "w", encoding="utf-8") as f:
                  json.dump(out, f, ensure_ascii=False, indent=2)
              print(f"data/media-{code}.json: {len(out['videos'])} videos, {len(out['screenshots'])} shots")
          if len(failed) == len(langs):
              raise SystemExit("media fetch failed for every language")
          if failed:
              print(f"media: kept previous data for {len(failed)} failed languages: {', '.join(failed)}")
          EOF

      - name: Fetch Steam characters (per language)
        run: |
          python3 - << 'EOF'
          import json, os, re, struct, time, urllib.request

          def fetch(url, attempts=3):
              last = None
              for attempt in range(attempts):
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                      with urllib.request.urlopen(req, timeout=30) as res:
                          return res.read()
                  except Exception as error:
                      last = error
                      time.sleep(2 * (attempt + 1))
              raise last

          def image_size(data):
              """(width, height) for JPEG or ISOBMFF (AVIF/HEIF) bytes, else None."""
              if data[:2] == b"\xff\xd8":
                  i = 2
                  while i + 4 < len(data):
                      if data[i] != 0xFF:
                          i += 1
                          continue
                      marker = data[i + 1]
                      if 0xC0 <= marker <= 0xCF and marker not in (0xC4, 0xC8, 0xCC):
                          h, w = struct.unpack(">HH", data[i + 5:i + 9])
                          return w, h
                      if marker in (0xD8, 0x01) or 0xD0 <= marker <= 0xD7:
                          i += 2
                          continue
                      size = struct.unpack(">H", data[i + 2:i + 4])[0]
                      if size < 2:
                          break
                      i += 2 + size
                  return None
              if len(data) > 12 and data[4:8] == b"ftyp":
                  def boxes(buf, start, end):
                      i = start
                      while i + 8 <= end:
                          size = struct.unpack(">I", buf[i:i + 4])[0]
                          header = 8
                          if size == 1:
                              size = struct.unpack(">Q", buf[i + 8:i + 16])[0]
                              header = 16
                          elif size == 0:
                              size = end - i
                          if size < header or i + size > end:
                              break
                          yield buf[i + 4:i + 8], i + header, i + size
                          i += size
                  for kind, s, e in boxes(data, 0, len(data)):
                      if kind != b"meta":
                          continue
                      # meta is a full box: 4 bytes of version/flags, then children
                      for kind2, s2, e2 in boxes(data, s + 4, e):
                          if kind2 != b"iprp":
                              continue
                          for kind3, s3, e3 in boxes(data, s2, e2):
                              if kind3 != b"ipco":
                                  continue
                              for kind4, s4, e4 in boxes(data, s3, e3):
                                  if kind4 == b"ispe":
                                      w, h = struct.unpack(">II", data[s4 + 4:s4 + 12])
                                      return w, h
              return None

          os.makedirs("data", exist_ok=True)
          langs = [("en", "english"), ("zh-CN", "schinese"), ("zh-TW", "tchinese"), ("ja", "japanese"), ("ko", "korean"),
                   ("fr", "french"), ("it", "italian"), ("de", "german"), ("es-ES", "spanish"), ("da", "danish"),
                   ("ru", "russian"), ("tr", "turkish"), ("no", "norwegian"), ("pl", "polish"), ("th", "thai"),
                   ("sv", "swedish"), ("fi", "finnish"), ("nl", "dutch"), ("pt-BR", "brazilian"), ("pt-PT", "portuguese"),
                   ("es-419", "latam"), ("uk", "ukrainian"), ("bg", "bulgarian"), ("hu", "hungarian"), ("id", "indonesian"),
                   ("el", "greek"), ("cs", "czech"), ("ro", "romanian"), ("vi", "vietnamese"), ("ar", "arabic")]
          failed = []
          for code, steam_lang in langs:
              try:
                  page = fetch(
                      f"https://store.steampowered.com/app/4142580/Live_Rise_4K_Fever/?l={steam_lang}"
                  ).decode("utf-8", "replace")
                  start = page.find('id="game_area_description"')
                  if start < 0:
                      raise ValueError("store page has no description block")
                  end = page.find('id="game_area_sys_req"', start)
                  if end < 0:
                      end = page.find('id="categories"', start)
                  if end < 0:
                      end = start + 120000
                  urls = [u for u in re.findall(r'<img[^>]+src="([^"]+)"', page[start:end])
                          if "/public/images/" not in u]
                  images = []
                  seen = set()
                  for url in urls:
                      if url in seen:
                          continue
                      seen.add(url)
                      try:
                          size = image_size(fetch(url))
                          # Character plates are poster-shaped; community banners are
                          # panoramic strips several times wider than tall.
                          if size and not 0.5 <= size[0] / size[1] <= 3.5:
                              continue
                      except Exception:
                          pass  # unreadable image: keep it rather than lose art
                      images.append(url)
                  if not images:
                      raise ValueError("description carries no character art")
              except Exception as error:
                  failed.append(code)
                  print(f"::warning::characters fetch failed for {code}: {error}")
                  continue
              with open(f"data/characters-{code}.json", "w", encoding="utf-8") as f:
                  json.dump({"images": images}, f, ensure_ascii=False, indent=2)
              print(f"data/characters-{code}.json: {len(images)} art")
          if len(failed) == len(langs):
              raise SystemExit("characters fetch failed for every language")
          if failed:
              print(f"characters: kept previous data for {len(failed)} failed languages: {', '.join(failed)}")
          EOF

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Nothing changed"
          else
            git commit -m "chore: refresh Steam news, media and characters"
            git push
          fi
